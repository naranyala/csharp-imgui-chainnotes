name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore app
        run: dotnet restore ChainNotes.csproj

      - name: Restore tests
        run: dotnet restore tests/ChainNotes.Tests/ChainNotes.Tests.csproj

      - name: Build
        run: dotnet build ChainNotes.csproj -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test tests/ChainNotes.Tests/ChainNotes.Tests.csproj -c Release --no-restore --warnaserror
